<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Tech Registration Form</title>
</head>

<body>

    <h1 align="center">B.Tech Registration Form</h1>

    <form>

        <!-- 1 -->
        <label>1. Registration Number:</label>
        <input type="text" name="registration_no"><br><br>

        <!-- 2 -->
        <label>2. First Name:</label>
        <input type="text" name="first_name"><br><br>

        <!-- 3 -->
        <label>3. Middle Name:</label>
        <input type="text" name="middle_name"><br><br>

        <!-- 4 -->
        <label>4. Last Name:</label>
        <input type="text" name="last_name"><br><br>

        <!-- 5 -->
        <label>5. Father's Name:</label>
        <input type="text" name="father_name"><br><br>

        <!-- 6 -->
        <label>6. Mother's Name:</label>
        <input type="text" name="mother_name"><br><br>

        <!-- 7 -->
        <label>7. Date of Birth:</label>
        <input type="date" name="dob"><br><br>

        <!-- 8 -->
        <label>8. Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other
        <br><br>

        <!-- 9 -->
        <label>9. Blood Group:</label>
        <select name="blood_group">
            <option>Select</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select><br><br>

        <!-- 10 -->
        <label>10. Mobile Number:</label>
        <input type="tel" name="mobile"><br><br>

        <!-- 11 -->
        <label>11. Alternate Mobile Number:</label>
        <input type="tel" name="alternate_mobile"><br><br>

        <!-- 12 -->
        <label>12. Email Address:</label>
        <input type="email" name="email"><br><br>

        <!-- 13 -->
        <label>13. Aadhaar Number:</label>
        <input type="text" name="aadhaar" maxlength="12"><br><br>

        <!-- 14 -->
        <label>14. Nationality:</label>
        <input type="text" name="nationality" value="Indian"><br><br>

        <!-- 15 -->
        <label>15. Category:</label>
        <select name="category">
            <option>Select Category</option>
            <option>General</option>
            <option>OBC</option>
            <option>SC</option>
            <option>ST</option>
            <option>EWS</option>
        </select><br><br>

        <!-- 16 -->
        <label>16. Religion:</label>
        <input type="text" name="religion"><br><br>

        <!-- 17 -->
        <label>17. Domicile State:</label>
        <select name="domicile">
            <option>Select State</option>
            <option>Uttar Pradesh</option>
            <option>Bihar</option>
            <option>Delhi</option>
            <option>Madhya Pradesh</option>
            <option>Rajasthan</option>
            <option>Other</option>
        </select><br><br>

        <!-- 18 -->
        <label>18. Address:</label><br>
        <textarea name="address" rows="3" cols="40"></textarea>
        <br><br>

        <!-- 19 -->
        <label>19. City:</label>
        <input type="text" name="city"><br><br>

        <!-- 20 -->
        <label>20. District:</label>
        <input type="text" name="district"><br><br>

        <!-- 21 -->
        <label>21. State:</label>
        <input type="text" name="state"><br><br>

        <!-- 22 -->
        <label>22. PIN Code:</label>
        <input type="text" name="pincode" maxlength="6"><br><br>

        <!-- 23 -->
        <label>23. 10th Board:</label>
        <input type="text" name="tenth_board"><br><br>

        <!-- 24 -->
        <label>24. 10th Passing Year:</label>
        <input type="number" name="tenth_year" min="1900" max="2100"><br><br>

        <!-- 25 -->
        <label>25. 10th Percentage:</label>
        <input type="number" name="tenth_percentage" step="0.01"><br><br>

        <!-- 26 -->
        <label>26. 10th Roll Number:</label>
        <input type="text" name="tenth_roll"><br><br>

        <!-- 27 -->
        <label>27. 12th Board:</label>
        <input type="text" name="twelfth_board"><br><br>

        <!-- 28 -->
        <label>28. 12th Passing Year:</label>
        <input type="number" name="twelfth_year" min="1900" max="2100"><br><br>

        <!-- 29 -->
        <label>29. 12th Percentage:</label>
        <input type="number" name="twelfth_percentage" step="0.01"><br><br>

        <!-- 30 -->
        <label>30. 12th Roll Number:</label>
        <input type="text" name="twelfth_roll"><br><br>

        <!-- 31 -->
        <label>31. Entrance Exam Name:</label>
        <select name="entrance_exam">
            <option>Select Exam</option>
            <option>JEE Main</option>
            <option>JEE Advanced</option>
            <option>State Entrance Exam</option>
            <option>Other</option>
        </select><br><br>

        <!-- 32 -->
        <label>32. Entrance Exam Roll Number:</label>
        <input type="text" name="entrance_roll"><br><br>

        <!-- 33 -->
        <label>33. Entrance Exam Rank:</label>
        <input type="number" name="entrance_rank"><br><br>

        <!-- 34 -->
        <label>34. B.Tech Branch:</label>
        <select name="branch">
            <option>Select Branch</option>
            <option>Computer Science & Engineering</option>
            <option>Information Technology</option>
            <option>Electronics & Communication Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Electrical Engineering</option>
        </select><br><br>

        <!-- 35 -->
        <label>35. Preferred College:</label>
        <input type="text" name="college"><br><br>

        <!-- 36 -->
        <label>36. Admission Type:</label>
        <select name="admission_type">
            <option>Select</option>
            <option>Regular</option>
            <option>Management Quota</option>
            <option>Lateral Entry</option>
        </select><br><br>

        <!-- 37 -->
        <label>37. Hostel Required:</label>
        <input type="radio" name="hostel" value="yes"> Yes
        <input type="radio" name="hostel" value="no"> No
        <br><br>

        <!-- 38 -->
        <label>38. Previous Qualification:</label>
        <input type="text" name="qualification"><br><br>

        <!-- 39 -->
        <label>39. Parent/Guardian Name:</label>
        <input type="text" name="guardian_name"><br><br>

        <!-- 40 -->
        <label>40. Parent/Guardian Mobile:</label>
        <input type="tel" name="guardian_mobile"><br><br>

        <!-- 41 -->
        <label>41. Parent/Guardian Occupation:</label>
        <input type="text" name="guardian_occupation"><br><br>

        <!-- 42 -->
        <label>42. Emergency Contact Number:</label>
        <input type="tel" name="emergency_contact"><br><br>

        <!-- 43 -->
        <label>43. Upload Photograph:</label>
        <input type="file" name="photo" accept="image/*"><br><br>

        <!-- 44 -->
        <label>44. Upload Signature:</label>
        <input type="file" name="signature" accept="image/*"><br><br>

        <!-- 45 -->
        <label>45. Declaration:</label><br>
        <input type="checkbox" name="declaration">
        I declare that all the information provided by me is correct.
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
